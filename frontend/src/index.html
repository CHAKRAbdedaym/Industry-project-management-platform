<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IndustryPM — Project Management Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plan projects, track tasks on a Kanban board and keep your team in the loop.">
  <meta name="theme-color" content="#0f1324">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint so there is no light/dark flash.
    try {
      var theme = localStorage.getItem('ipmp_theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
