<div class="card" style="max-width: 380px; margin: 3rem auto">
  <h1>Create an account</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="fullName">Full name</label>
      <input id="fullName" type="text" formControlName="fullName" autocomplete="name" />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
      />
      <span class="muted">At least 8 characters</span>
    </div>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="muted" *ngIf="successMessage">{{ successMessage }}</p>
    <button type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Creating...' : 'Register' }}
    </button>
  </form>
  <p class="muted" style="margin-top: 1rem">
    Already have an account? <a routerLink="/login">Log in</a>
  </p>
</div>
