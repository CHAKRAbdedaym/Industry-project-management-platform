<app-auth-layout heading="Welcome back" subheading="Sign in to continue to your workspace.">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (errorMessage()) {
      <div class="alert alert-error" role="alert"><app-icon name="alert" [size]="16" /> {{ errorMessage() }}</div>
    }

    <div class="field">
      <label for="email">Email</label>
      <div class="input-icon">
        <app-icon name="mail" [size]="16" />
        <input id="email" class="input" type="email" formControlName="email" autocomplete="email" placeholder="you@company.com" />
      </div>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field-error">Enter a valid email address.</span>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-icon">
        <app-icon name="lock" [size]="16" />
        <input
          id="password"
          class="input"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
        <button
          type="button"
          class="btn btn-ghost btn-icon btn-sm input-action"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="16" />
        </button>
      </div>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">Enter your password.</span>
      }
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()" style="height: 42px; margin-top: 0.5rem">
      @if (loading()) {
        <span class="spinner"></span> Signing in…
      } @else {
        Sign in <app-icon name="arrow-right" [size]="16" />
      }
    </button>
  </form>

  <p class="muted" style="margin-top: 1.5rem; text-align: center">
    New to IndustryPM? <a routerLink="/register">Create an account</a>
  </p>
</app-auth-layout>
