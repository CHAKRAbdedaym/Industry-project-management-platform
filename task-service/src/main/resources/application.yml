server:
  port: 8083

spring:
  application:
    name: task-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/task_service}
    username: ${DB_USERNAME:task_service}
    password: ${DB_PASSWORD:task_service}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-min}
