server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auth_service}
    username: ${DB_USERNAME:auth_service}
    password: ${DB_PASSWORD:auth_service}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
