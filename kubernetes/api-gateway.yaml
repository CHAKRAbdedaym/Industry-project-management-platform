apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: industry-platform
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      restartPolicy: Always
      # No initContainer: api-gateway has no database of its own, and Spring Cloud
      # Gateway does not fail to start if a routed-to backend isn't up yet - it just
      # proxies requests as each backend becomes available.
      containers:
        - name: api-gateway
          image: abdedaym/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: industry-platform-config
                  key: AUTH_SERVICE_URL
            - name: PROJECT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: industry-platform-config
                  key: PROJECT_SERVICE_URL
            - name: TASK_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: industry-platform-config
                  key: TASK_SERVICE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: industry-platform-config
                  key: NOTIFICATION_SERVICE_URL
          # api-gateway has spring-boot-starter-actuator (pom.xml) with
          # management.endpoints.web.exposure.include: health, so a real HTTP health
          # check is available here (unlike the other four services).
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 35
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "150m"
              memory: "320Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: industry-platform
  labels:
    app: api-gateway
spec:
  # Public entry point for direct API access (Postman/curl/mobile clients).
  # Port MUST be 8080, not 80: frontend/nginx.conf has proxy_pass hardcoded to
  # "http://api-gateway:8080/api/" (unchanged from docker-compose), and that request
  # resolves against this Service's own port, not just the container's containerPort.
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
