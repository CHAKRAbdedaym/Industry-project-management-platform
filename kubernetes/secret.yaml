# DEV/DEMO CREDENTIALS ONLY.
# Every value below is the exact default already committed in this repo
# (auth-service/project-service/task-service/notification-service application.yml,
# and db/init-multi-db.sql) for local docker-compose development. None of this is new
# exposure — it mirrors what is already in plaintext in the repository.
#
# BEFORE ANY REAL/PRODUCTION DEPLOYMENT:
#   - Replace JWT_SECRET with a long random value (32+ bytes), and keep it identical
#     across auth-service, project-service, task-service, and notification-service —
#     auth-service issues JWTs and the other three verify them with this same key.
#   - Replace POSTGRES_PASSWORD and every *_DB_PASSWORD with strong, unique values,
#     and update db/init-multi-db.sql (kubernetes/postgres.yaml's init ConfigMap) to
#     match, since that script creates these exact users/passwords on first boot.
#   - Do not commit real production secrets to git; use a secret manager
#     (AWS Secrets Manager / External Secrets Operator) or `kubectl create secret`
#     out-of-band instead of this file, once these are no longer dev defaults.
apiVersion: v1
kind: Secret
metadata:
  name: industry-platform-secrets
  namespace: industry-platform
type: Opaque
stringData:
  JWT_SECRET: "dev-only-secret-key-change-me-please-32-bytes-min"

  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"

  AUTH_DB_USERNAME: "auth_service"
  AUTH_DB_PASSWORD: "auth_service"

  PROJECT_DB_USERNAME: "project_service"
  PROJECT_DB_PASSWORD: "project_service"

  TASK_DB_USERNAME: "task_service"
  TASK_DB_PASSWORD: "task_service"

  NOTIFICATION_DB_USERNAME: "notification_service"
  NOTIFICATION_DB_PASSWORD: "notification_service"
